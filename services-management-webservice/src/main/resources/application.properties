# Server
spring.profiles.active=log-to-file
spring.application.name=services-management
server.port=8080
server.max-http-header-size=1024KB
spring.servlet.multipart.max-file-size=1024KB
spring.servlet.multipart.max-request-size=1024KB
spring.output.ansi.enabled=DETECT
spring.jmx.default-domain=tecrep
spring.main.allow-bean-definition-overriding=true
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write_dates_as_timestamps=false

# Datasource
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.cache-prep-stmts=true
spring.datasource.hikari.connection-timeout=18000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.prep-stmt-cache-size=250
spring.datasource.hikari.prep-stmt-cache-sql-limit=2048
spring.datasource.hikari.use-server-prep-stmts=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.revision_field_name=revision_id
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revision_type

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

synchronization.unm.enabled=${UNM_SYNC:false}
synchronization.unm.exchange=svc-unm-sync
synchronization.unm.routing-key=#

# Logging
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL_QUERY:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_SQL_PARAM:INFO}

# Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.jmx.exposure.exclude=*
management.metrics.web.server.request.autotime.enabled=true

# Business values
plmn.code=21210
unm-sync=${UNM_SYNC:true}

# Map Maven properties to Spring Boot
maven.project.artifactId=@project.parent.artifactId@
maven.project.version=@project.version@

# Common importer configuration
importer.configuration.package.entities=mc.monacotelecom.services.entity

#Open Api
springdoc.swagger-ui.url=/tecrep/svc/v3/api-docs
springdoc.swagger-ui.configUrl=/tecrep/svc/v3/api-docs/swagger-config
springdoc.swagger-ui.oauth2RedirectUrl=/tecrep/svc/swagger-ui/oauth2-redirect.html
springdoc.swagger-ui.serverUrl=/tecrep/svc