spring:
  datasource:
    url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
    password: sa
    username: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  rabbitmq:
    host: localhost
    port: 5672
    password: guest
    username: guest
  cache:
    type: NONE

unm-sync: false

keycloak:
  auth-server-url: http://localhost
  credentials:
    secret: secret
  realm: test
  resource: test
