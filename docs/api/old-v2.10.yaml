      tags:
        - ActivationCode API
      summary: Get all ActivationCodes by several criteria
      operationId: searchActivationCodes
      produces:
        - "*/*"
      parameters:
        - name: activCode
          in: query
          description: Identifer of the activationCode
          required: false
          type: string
        - name: nature
          in: query
          description: Nature of the activationCode
          required: false
          type: string
          enum:
            - PROFILE
            - OPTION
            - BUCKET
            - BOOSTER
            - BARRING
            - LOCK
            - FORWARDING
            - CONFIG
        - name: networkComponent
          in: query
          description: Network Component of the activationCode
          required: false
          type: string
          enum:
            - TVCAS
            - ZATTOO
            - PCRF
            - SPG
            - SCP
            - DISE
            - OLT
            - CS
            - STREAMWIDE
            - SDP
            - OPI
        - name: offset
          in: query
          required: false
          type: integer
          format: int64
        - name: page
          in: query
          description: Results page you want to retrieve (0..N)
          required: false
          type: integer
          format: int32
        - name: pageNumber
          in: query
          required: false
          type: integer
          format: int32
        - name: pageSize
          in: query
          required: false
          type: integer
          format: int32
        - name: paged
          in: query
          required: false
          type: boolean
        - name: size
          in: query
          description: Number of records per page.
          required: false
          type: integer
          format: int32
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property(,asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: sort.sorted
          in: query
          required: false
          type: boolean
        - name: sort.unsorted
          in: query
          required: false
          type: boolean
        - name: unpaged
          in: query
          required: false
          type: boolean
