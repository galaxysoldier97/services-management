      parameters:
        - name: page
          in: query
          required: false
          type: integer
          format: int32
        - name: size
          in: query
          required: false
          type: integer
          format: int32
        - name: sort
          in: query
          required: false
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PagedModel«ProvisioningTagDTO»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
        - OAuth2: [ ]
    post:
      tags:
        - ProvisioningTag API
      summary: Add a provisioningtag
      operationId: addProvisioningTag
      consumes:
        - application/json
      produces:
        - '*/*'
      parameters:
        - in: body
          name: provisioningTagDTO
          description: provisioningTagDTO
          required: true
          schema:
            $ref: '#/definitions/ProvisioningTagDTOReq'
      responses:
        '201':
          description: provisioningtag created
          schema:
            $ref: '#/definitions/ProvisioningTagDTORes'
        '401':
          description: Unauthorized
        '403':
