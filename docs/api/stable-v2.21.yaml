          name: parametersOnActionRequestDTO
          description: parametersOnActionRequestDTO
          required: true
          schema:
            $ref: '#/definitions/ParametersOnActionRequestDTO'
      responses:
        '200':
          description: get All ParametersOnAction
          schema:
            $ref: '#/definitions/ParametersOnActionResponseDTO'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal error
      security:
        - OAuth2: [ ]
  /private/auth/provisioningtags/search:
    get:
      tags:
        - ProvisioningTag API
      summary: Search a provisioningtag by several criteria,...
      operationId: searchProvisioningTag
      produces:
        - '*/*'
      parameters:
        - name: accessType
          in: query
          description: Network Access type of the provisioning Action parameters
          required: false
          type: string
          enum:
            - BBHB
            - DISE
            - DOCSIS
            - FREEDHOME
            - FTTH
            - MOBILE
            - TRUNKSIP
            - ZATTOO
        - name: activity
          in: query
          description: Provisioning Tag activity of the provisioning Action parameters
          required: false
          type: string
          enum:
            - INTERNET
            - MAIL
            - MEVO
            - MOBILE
            - NDD
            - OX
            - TELEPHONY
            - TV
        - name: nature
          in: query
          description: Provisioning Tag Nature of the provisioning Action parameters
          required: false
          type: string
          enum:
            - A
            - C
            - E
            - O
            - P
            - R
            - U
        - name: page
          in: query
          description: Results page you want to retrieve (0..N)
          required: false
          type: integer
          format: int32
          x-example: 0
        - name: size
          in: query
          description: Number of records per page.
          required: false
          type: integer
          format: int32
          x-example: 10
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: tagCode
          in: query
          description: Tag Code of the provisioning Action parameters
          required: false
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PagedModel«ProvisioningTagDTO»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
        - OAuth2: [ ]
