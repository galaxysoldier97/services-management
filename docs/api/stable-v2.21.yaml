          description: Internal error
      security:
        - OAuth2: [ ]
  /private/auth/provisioningtags/decomposeproductsrequest:
    patch:
      tags:
        - ProvisioningTag API
      summary: decompose products request
      operationId: decompose
      consumes:
        - application/json
      produces:
        - '*/*'
      parameters:
        - in: body
          name: provisioningProductRequestsDTO
          description: provisioningProductRequestsDTO
