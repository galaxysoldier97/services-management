        - OAuth2: [ ]
  /private/auth/provisioningtags/parametersOnActions:
    post:
      tags:
        - ProvisioningTag API
      summary: Get all ParametersOnAction for a provisioningtag
      operationId: getAllParametersOnAction
      consumes:
