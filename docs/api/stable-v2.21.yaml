swagger: '2.0'
info:
  version: 2.20.0
  title: services-management
host: localhost:10007
basePath: /
tags:
  - name: ActivationCode API
    description: Activation Code Controller
  - name: Enumeration API
    description: Enum Controller
  - name: Importer Management
    description: Importer Controller
  - name: ProvisioningTag API
    description: Provisioning Tag Controller
  - name: Service API
    description: Service Controller
  - name: Statistics API
    description: Stats Controller
  - name: Tag Activation API
    description: Tag Activation Controller
  - name: Technical Parameter API
    description: Technical Parameter Controller
paths:
  /private/auth/activationcodes:
    get:
      tags:
        - ActivationCode API
      summary: Get all ActivationCodes
      operationId: getAllActivationCodes
      produces:
        - '*/*'
      parameters:
        - name: page
          in: query
          required: false
          type: integer
          format: int32
        - name: size
          in: query
          required: false
          type: integer
          format: int32
        - name: sort
          in: query
          required: false
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PagedModel«ActivationCodeDTO»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
        - OAuth2: [ ]
    post:
      tags:
        - ActivationCode API
      summary: Add a ActivationCode
      operationId: addActivationCode
      consumes:
        - application/json
      produces:
        - '*/*'
      parameters:
        - in: body
          name: activationCodeDTO
          description: activationCodeDTO
          required: true
          schema:
            $ref: '#/definitions/ActivationCodeDTOReq'
      responses:
        '201':
          description: ActivationCode created
          schema:
            $ref: '#/definitions/ActivationCodeDTORes'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal error
      security:
        - OAuth2: [ ]
  /private/auth/activationcodes/accessType/{accessType}:
    get:
      tags:
        - ActivationCode API
      summary: Get all ActivationCodes by accessType
      operationId: getAllActivationCodesByAccessType
      produces:
        - '*/*'
      parameters:
        - name: accessType
          in: path
          description: accessType
          required: true
          type: string
        - name: page
          in: query
          required: false
          type: integer
          format: int32
        - name: size
          in: query
          required: false
          type: integer
          format: int32
        - name: sort
          in: query
          required: false
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PagedModel«ServiceActivationDTO»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
        - OAuth2: [ ]
  /private/auth/activationcodes/search:
    get:
      tags:
        - ActivationCode API
      summary: Get all ActivationCodes by several criteria
      operationId: searchActivationCodes
      produces:
        - '*/*'
      parameters:
        - name: activCode
          in: query
          description: Identifer of the activationCode
          required: false
          type: string
        - name: nature
          in: query
          description: Nature of the activationCode
          required: false
          type: string
          enum:
            - BARRING
            - BOOSTER
            - BUCKET
            - CONFIG
            - FORWARDING
            - LOCK
            - OPTION
            - PROFILE
        - name: networkComponent
          in: query
          description: Network Component of the activationCode
          required: false
          type: string
          enum:
            - CS
            - DISE
            - OLT
            - OPI
            - PCRF
            - SCP
            - SDP
            - SPG
            - STREAMWIDE
            - TVCAS
            - ZATTOO
        - name: page
          in: query
          description: Results page you want to retrieve (0..N)
          required: false
          type: integer
          format: int32
          x-example: 0
        - name: size
          in: query
          description: Number of records per page.
          required: false
          type: integer
          format: int32
          x-example: 10
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PagedModel«ActivationCodeDTO»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
        - OAuth2: [ ]
  /private/auth/activationcodes/techid/{techId}/{accessType}:
    get:
      tags:
        - ActivationCode API
      summary: Get all ActivationCodes by techId
      operationId: getAllActivationCodesByTechId
      produces:
        - '*/*'
      parameters:
        - name: accessType
          in: path
          description: accessType
          required: true
          type: string
        - name: page
          in: query
          required: false
          type: integer
          format: int32
        - name: size
          in: query
          required: false
          type: integer
          format: int32
        - name: sort
          in: query
          required: false
          type: string
        - name: techId
          in: path
          description: techId
          required: true
          type: string
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/PagedModel«ServiceActivationDTO»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      security:
        - OAuth2: [ ]
  /private/auth/activationcodes/{activationCodeId}:
    put:
      tags:
        - ActivationCode API
      summary: Update a activationCode
      operationId: updateActivationCode
      consumes:
        - application/json
      produces:
        - '*/*'
      parameters:
        - in: body
          name: activationCodeDTO
          description: activationCodeDTO
          required: true
          schema:
            $ref: '#/definitions/ActivationCodeDTOReq'
        - name: activationCodeId
          in: path
          description: activationCodeId
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: activationCode updated
          schema:
            $ref: '#/definitions/ActivationCodeDTORes'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal error
      security:
        - OAuth2: [ ]
    delete:
      tags:
        - ActivationCode API
      summary: Delete a ActivationCode by activationCodeId
      operationId: deleteActivationCodeById
      produces:
        - '*/*'
      parameters:
        - name: activationCodeId
          in: path
          description: activationCodeId
          required: true
          type: integer
          format: int64
      responses:
        '204':
          description: activationCode deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal error
      security:
        - OAuth2: [ ]
  /private/auth/activationcodes/{id}:
    get:
      tags:
        - ActivationCode API
      summary: Find a ActivationCode by Id
      operationId: getActivationCodeById
      produces:
        - '*/*'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: ActivationCode found
          schema:
            $ref: '#/definitions/ActivationCodeDTORes'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal error
      security:
        - OAuth2: [ ]
  /private/auth/import/history/last:
    delete:
      tags:
        - Importer Management
      summary: Delete the last import history
      operationId: deleteLastUsingDELETE
      produces:
        - '*/*'
      responses:
        '204':
          description: Import history successfully deleted
        '400':
          description: Input error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal processing error
      security:
        - OAuth2: [ ]
  /private/auth/import/history/search:
    get:
      tags:
        - Importer Management
      summary: Search existing import histories
      operationId: searchUsingGET
      produces:
        - '*/*'
      parameters:
        - name: endDate
          in: query
          description: Ending date of the searched import
          required: false
          type: string
        - name: fileName
          in: query
          description: File name of the searched import
          required: false
          type: string
        - name: page
          in: query
          description: Results page you want to retrieve (0..N)
          required: false
          type: integer
          format: int32
          x-example: 0
        - name: size
          in: query
          description: Number of records per page.
          required: false
          type: integer
          format: int32
          x-example: 10
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property(,asc|desc). Default sort order is ascending. Multiple sort criteria are supported.'
          required: false
          type: string
        - name: startDate
          in: query
          description: Starting date of the searched import
          required: false
          type: string
        - name: status
          in: query
          description: Status of the searched import
          required: false
          type: string
          enum:
            - ABORTED
            - COMPLETED
            - STARTED
      responses:
        '200':
          description: Import histories matching the criteria successfully returned
          schema:
            $ref: '#/definitions/Page«ImportHistoryDTO»'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal processing error
      security:
        - OAuth2: [ ]
  /private/auth/import/history/{id}:
    get:
      tags:
        - Importer Management
      summary: Get an existing import history by its internal ID
      operationId: getByIdUsingGET
      produces:
        - '*/*'
      parameters:
        - name: id
          in: path
          description: id
          required: true
          type: integer
          format: int64
      responses:
        '200':
          description: Import history successfully returned
          schema:
            $ref: '#/definitions/ImportHistoryDTO'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Import history not found
        '500':
          description: Internal processing error
      security:
        - OAuth2: [ ]
  /private/auth/import/{entity}/start:
    post:
      tags:
        - Importer Management
      summary: Launch a new import
      operationId: uploadFileHandlerUsingPOST
      consumes:
        - multipart/form-data
      produces:
        - '*/*'
      parameters:
        - name: lastAccessedTime
          in: formData
          required: false
          type: integer
          format: int64
        - name: new
          in: formData
          required: false
          type: boolean
        - name: maxInactiveInterval
          in: formData
          required: false
          type: integer
          format: int32
        - name: creationTime
          in: formData
          required: false
          type: integer
          format: int64
        - name: valueNames
          in: formData
          required: false
          type: array
          items:
            type: string
          collectionFormat: multi
        - name: id
          in: formData
          required: false
          type: string
        - name: entity
          in: path
          description: entity
          required: true
          type: string
        - in: body
          name: file
          description: file
          required: false
          schema:
            type: string
            format: binary
      responses:
        '200':
          description: Import successfully launched
          schema:
            $ref: '#/definitions/ImportHistoryDTO'
        '201':
          description: Created
        '400':
          description: Input error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal processing error
      security:
        - OAuth2: [ ]
  /private/auth/provisioningtags:
    get:
      tags:
